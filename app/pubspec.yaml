name: resonchat
description: Flutter XMPP client with dual-track OMEMO (standard + post-quantum).
publish_to: none
version: 0.0.3

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any

  moxlib:
    path: ../vendor/moxlib
  moxxmpp:
    path: ../vendor/moxxmpp/packages/moxxmpp
  moxxmpp_socket_tcp:
    path: ../vendor/moxxmpp/packages/moxxmpp_socket_tcp
  omemo_dart:
    path: ../vendor/omemo_dart

  # Native libsignal (PQXDH + SPQR) via Flutter Rust Bridge. AGPL-3.0 —
  # combined with this GPLv3 app the effective terms are AGPL for the binary.
  # Path fork: vendor/libsignal_dart patched for ML-KEM-1024 (0x0A).
  # Classic A-track Curve/X3DH lives in omemo_dart → transitive
  # libsignal_protocol_dart only (no direct / test dep in this app).
  libsignal:
    path: ../vendor/libsignal_dart

  cryptography: ^2.9.0
  pqcrypto: ^0.4.2
  xml: ^6.5.0
  hex: ^0.2.0
  path: ^1.9.0

  riverpod: ^2.6.1
  flutter_riverpod: ^2.6.1
  drift: ^2.35.1
  sqlite3_flutter_libs: ^0.5.24
  flutter_secure_storage: ^11.2.0
  path_provider: ^2.1.0
  logging: ^1.2.0
  sqlite3: ^3.5.2
  http: ^1.2.0
  file_picker: ^13.1.0
  mime: ^2.0.0
  open_filex: ^4.7.0
  url_launcher: ^6.3.1
  flutter_svg: ^2.0.17
  dynamic_color: ^1.7.0
  flutter_local_notifications: ^19.0.0
  record: ^7.1.2
  web: ^1.1.1
  flutter_slidable: ^4.0.3
hooks:
  user_defines:
    sqlite3:
      source: sqlcipher

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  test: ^1.25.8
  drift_dev: ^2.20.0
  build_runner: ^2.4.12

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/icons/
