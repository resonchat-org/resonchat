# Build release APKs (arm + x86) + Linux AppImage/deb/rpm + Windows setup
# + Web (WASM) tar.gz, and attach them to the GitHub Release.
#
# Trigger: publish a Release in the GitHub UI (or `gh release create`).
# Assets land on that Release page — the usual place for downloadable binaries.
#
# Also dispatchable by hand: a release run checks out the *tag's* commit, so a
# packaging fix on main cannot reach an already-published tag without rewriting
# it. Dispatching from main builds the fixed tree and attaches the artifacts to
# the existing Release named by `tag` (nothing is rewritten).
#
#   gh workflow run CD -f tag=0.0.4

name: CD

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag whose Release should receive the artifacts
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: cd-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: true

env:
  TAG: ${{ github.event.release.tag_name || inputs.tag }}

jobs:
  build-apk:
    name: Build APK (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: arm64
            abi: arm
            artifact: arm64
          - name: x86_64
            abi: x86
            artifact: x86_64
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Android native build deps
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Generate submodule code
        run: ./scripts/generate_submodule_code.sh

      - name: Resolve app dependencies
        working-directory: app
        run: flutter pub get

      - name: Generate drift code
        working-directory: app
        run: dart run build_runner build

      - name: Build APK (${{ matrix.name }})
        # Release currently signs with the debug keystore (see
        # android/app/build.gradle.kts); swap in a real keystore later.
        run: |
          set -euo pipefail
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_NDK_HOME="${ANDROID_NDK_HOME:-$(ls -d "$ANDROID_HOME"/ndk/* | sort -V | tail -1)}"
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_NDK_HOME=$ANDROID_NDK_HOME"
          ./scripts/build_android.sh --release --abi "${{ matrix.abi }}"

      - name: Stage APK
        run: |
          set -euo pipefail
          mkdir -p dist
          src=app/build/app/outputs/flutter-apk/app-release.apk
          test -f "$src"
          cp "$src" "dist/resonchat-${TAG}-${{ matrix.artifact }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: apk-${{ matrix.artifact }}
          path: dist/resonchat-*-${{ matrix.artifact }}.apk
          if-no-files-found: error

  build-linux:
    name: Build Linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Linux desktop build deps
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev libsecret-1-dev \
            curl ffmpeg

      - name: Generate submodule code
        run: ./scripts/generate_submodule_code.sh

      - name: Resolve app dependencies
        working-directory: app
        run: flutter pub get

      - name: Generate drift code
        working-directory: app
        run: dart run build_runner build

      - name: Build AppImage
        run: ./scripts/build_appimage.sh

      - name: Install native packaging tools
        run: |
          set -euo pipefail
          sudo apt-get install -y dpkg-dev rpm

      - name: Build .deb / .rpm
        # Reuses the Flutter bundle from the AppImage step (--skip-build).
        # Linked .so → dpkg-shlibdeps / rpm AutoReq; CLI deps → scripts/linux_pkg_deps.sh.
        run: ./scripts/build_deb_rpm.sh --skip-build

      - name: Stage Linux artifacts
        run: |
          set -euo pipefail
          mkdir -p dist
          src=$(ls app/build/resonchat-*-x86_64.AppImage | head -1)
          test -f "$src"
          cp "$src" "dist/resonchat-${TAG}-x86_64.AppImage"
          chmod +x "dist/resonchat-${TAG}-x86_64.AppImage"
          deb=$(ls app/build/resonchat_*.deb | head -1)
          test -f "$deb"
          cp "$deb" "dist/resonchat-${TAG}-x86_64.deb"
          rpm=$(ls app/build/resonchat-*.rpm | head -1)
          test -f "$rpm"
          cp "$rpm" "dist/resonchat-${TAG}-x86_64.rpm"

      - uses: actions/upload-artifact@v4
        with:
          name: linux-packages
          path: |
            dist/resonchat-*-x86_64.AppImage
            dist/resonchat-*-x86_64.deb
            dist/resonchat-*-x86_64.rpm
          if-no-files-found: error

  build-windows:
    name: Build Windows setup
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Generate submodule code
        shell: bash
        run: ./scripts/generate_submodule_code.sh

      - name: Resolve app dependencies
        working-directory: app
        run: flutter pub get

      - name: Generate drift code
        working-directory: app
        run: dart run build_runner build

      - name: Build Windows setup
        shell: pwsh
        run: .\scripts\build_windows.ps1

      - name: Stage Windows artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          setup=$(ls app/build/windows/installer/resonchat-*-x86_64-setup.exe | head -1)
          test -f "$setup"
          cp "$setup" "dist/resonchat-${TAG}-x86_64-setup.exe"

      - uses: actions/upload-artifact@v4
        with:
          name: windows-setup
          path: dist/resonchat-*-x86_64-setup.exe
          if-no-files-found: error

  build-web:
    name: Build Web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate submodule code
        run: ./scripts/generate_submodule_code.sh

      - name: Resolve app dependencies
        working-directory: app
        run: flutter pub get

      - name: Generate drift code
        working-directory: app
        run: dart run build_runner build

      - name: Build Web
        run: ./scripts/build_web.sh

      - name: Stage Web tarball
        run: |
          set -euo pipefail
          mkdir -p dist
          test -f app/build/web/index.html
          tar -C app/build/web -czf "dist/resonchat-${TAG}-wasm.tar.gz" .
          ls -lh "dist/resonchat-${TAG}-wasm.tar.gz"

      - uses: actions/upload-artifact@v4
        with:
          name: wasm-tarball
          path: dist/resonchat-*-wasm.tar.gz
          if-no-files-found: error

  upload-release:
    name: Attach to GitHub Release
    needs: [build-apk, build-linux, build-windows, build-web]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: List assets
        run: ls -la dist/

      - name: Upload assets to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          files: |
            dist/resonchat-*-arm64.apk
            dist/resonchat-*-x86_64.apk
            dist/resonchat-*-x86_64.AppImage
            dist/resonchat-*-x86_64.deb
            dist/resonchat-*-x86_64.rpm
            dist/resonchat-*-x86_64-setup.exe
            dist/resonchat-*-wasm.tar.gz
          fail_on_unmatched_files: true
