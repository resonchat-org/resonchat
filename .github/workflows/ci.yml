name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  analyze-test:
    name: Analyze + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate submodule code
        run: ./scripts/generate_submodule_code.sh

      - name: Resolve app dependencies
        working-directory: app
        run: flutter pub get

      - name: Generate drift code
        working-directory: app
        run: dart run build_runner build

      # `flutter analyze`'s LSP server crashes on this repo's path; `dart
      # analyze` gives the same diagnostics reliably.
      - name: Analyze
        working-directory: app
        run: dart analyze lib test

      - name: Test
        working-directory: app
        run: flutter test --no-pub

  build-apk:
    name: Build debug APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Android build deps
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Generate submodule code
        run: ./scripts/generate_submodule_code.sh

      - name: Resolve app dependencies
        working-directory: app
        run: flutter pub get

      - name: Generate drift code
        working-directory: app
        run: dart run build_runner build

      - name: Build APK
        run: |
          set -euo pipefail
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_NDK_HOME="${ANDROID_NDK_HOME:-$(ls -d "$ANDROID_HOME"/ndk/* | sort -V | tail -1)}"
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_NDK_HOME=$ANDROID_NDK_HOME"
          ./scripts/build_android.sh --debug

  build-linux:
    name: Build Linux AppImage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Linux desktop build deps
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev libsecret-1-dev \
            curl

      - name: Generate submodule code
        run: ./scripts/generate_submodule_code.sh

      - name: Resolve app dependencies
        working-directory: app
        run: flutter pub get

      - name: Generate drift code
        working-directory: app
        run: dart run build_runner build

      - name: Build AppImage
        run: ./scripts/build_appimage.sh

  build-windows:
    name: Build Windows setup
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Generate submodule code
        shell: bash
        run: ./scripts/generate_submodule_code.sh

      - name: Resolve app dependencies
        working-directory: app
        run: flutter pub get

      - name: Generate drift code
        working-directory: app
        run: dart run build_runner build

      - name: Build Windows setup
        shell: pwsh
        run: .\scripts\build_windows.ps1

  build-web:
    name: Build Web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate submodule code
        run: ./scripts/generate_submodule_code.sh

      - name: Resolve app dependencies
        working-directory: app
        run: flutter pub get

      - name: Generate drift code
        working-directory: app
        run: dart run build_runner build

      - name: Build Web
        # Compile smoke test only — release tarball is CD.
        run: ./scripts/build_web.sh
