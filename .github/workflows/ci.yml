name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  analyze-test:
    name: Analyze + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: stable
          channel: stable
          cache: true

      - name: Generate submodule code
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler
          dart pub global activate protoc_plugin
          export PATH="$PATH:$HOME/.pub-cache/bin"
          (cd packages/moxlib && dart pub get)
          (cd packages/omemo_dart && dart pub get && protoc --dart_out=lib/src/protobuf -Iprotobuf protobuf/schema.proto)
          (cd packages/moxxmpp/packages/moxxmpp && dart pub get && dart run build_runner build)
          (cd packages/moxxmpp/packages/moxxmpp_socket_tcp && dart pub get)

      - name: Resolve app dependencies
        working-directory: app
        run: flutter pub get

      - name: Generate drift code
        working-directory: app
        run: dart run build_runner build

      # `flutter analyze`'s LSP server crashes on this repo's path; `dart
      # analyze` gives the same diagnostics reliably.
      - name: Analyze
        working-directory: app
        run: dart analyze lib test

      - name: Test
        working-directory: app
        run: flutter test --no-pub

  build-apk:
    name: Build debug APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: stable
          channel: stable
          cache: true

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Generate submodule code
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler
          dart pub global activate protoc_plugin
          export PATH="$PATH:$HOME/.pub-cache/bin"
          (cd packages/moxlib && dart pub get)
          (cd packages/omemo_dart && dart pub get && protoc --dart_out=lib/src/protobuf -Iprotobuf protobuf/schema.proto)
          (cd packages/moxxmpp/packages/moxxmpp && dart pub get && dart run build_runner build)
          (cd packages/moxxmpp/packages/moxxmpp_socket_tcp && dart pub get)

      - name: Resolve app dependencies
        working-directory: app
        run: flutter pub get

      - name: Generate drift code
        working-directory: app
        run: dart run build_runner build

      - name: Build APK
        working-directory: app
        run: flutter build apk --debug
