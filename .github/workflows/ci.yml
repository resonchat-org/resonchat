name: CI

on:
  push:
    branches: [main]
    # Documentation-only changes skip CI entirely (no compile, no analyze/test).
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'LICENSE'
  pull_request:
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'LICENSE'
  workflow_dispatch:

jobs:
  analyze-test:
    name: Analyze + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate submodule code
        run: ./scripts/generate_submodule_code.sh

      - name: Resolve app dependencies
        working-directory: app
        run: flutter pub get

      - name: Generate drift code
        working-directory: app
        run: dart run build_runner build

      # `flutter analyze`'s LSP server crashes on this repo's path; `dart
      # analyze` gives the same diagnostics reliably.
      - name: Analyze
        working-directory: app
        run: dart analyze lib test

      - name: Test
        working-directory: app
        run: flutter test --no-pub

  compile:
    name: Compile
    # Full Linux + Web compile is slow; only run it for pull requests and
    # manual dispatches. Pushes to main keep the fast analyze + test job.
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Linux desktop build deps
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev libsecret-1-dev

      - name: Generate submodule code
        run: ./scripts/generate_submodule_code.sh

      - name: Resolve app dependencies
        working-directory: app
        run: flutter pub get

      - name: Generate drift code
        working-directory: app
        run: dart run build_runner build

      - name: Compile Linux
        working-directory: app
        run: |
          set -euo pipefail
          flutter config --enable-linux-desktop
          flutter build linux --debug

      - name: Compile Web
        # Drift WASM assets are fetched by the script; the tarball is CD.
        run: ./scripts/build_web.sh
