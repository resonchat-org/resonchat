# Run OpenCode on demand: mention `/oc` or `/opencode` in an issue or PR
# comment and OpenCode executes the task inside a GitHub Actions runner
# (replies, creates branches, opens PRs).
#
# Auth uses the repository-provided GITHUB_TOKEN (`use_github_token: true`), so
# no OpenCode GitHub App install is required. Note: branches/PRs created with
# GITHUB_TOKEN do not trigger other workflows (GitHub limitation).
#
# The model is served by a local `commandcode-proxy` started inside the runner
# and reached through the `ccproxy` provider in ../../opencode.json. The
# Command Code key lives in the `CC_PROXY_KEY` repository secret.
#
# Only organization members may trigger it. `author_association` is NOT used:
# resonchat-org memberships are private, and GitHub then reports CONTRIBUTOR in
# event payloads even for members. Instead the actor is checked against the org
# members endpoint with `MEMBERSHIP_TOKEN` (a fine-grained PAT with
# `Members: read-only`), which sees private memberships too.

name: opencode

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  opencode:
    if: |
      contains(github.event.comment.body, '/oc') ||
      contains(github.event.comment.body, '/opencode')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - name: Require an organization member
        id: member
        env:
          MEMBERSHIP_TOKEN: ${{ secrets.MEMBERSHIP_TOKEN }}
        run: |
          set -euo pipefail
          code=$(curl -s -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer $MEMBERSHIP_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/orgs/resonchat-org/members/${{ github.actor }}")
          if [ "$code" = "204" ]; then
            echo "allowed=true" >> "$GITHUB_OUTPUT"
          else
            echo "allowed=false (org members lookup returned HTTP $code)"
            echo "allowed=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v6
        if: steps.member.outputs.allowed == 'true'
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Start commandcode-proxy
        if: steps.member.outputs.allowed == 'true'
        env:
          # Pinned for reproducibility; bump deliberately.
          CC_PROXY_COMMIT: 972828aff37f07c9cb12959bc6a1f4d44aaa005a
          # The upstream config.json defaults to 3050; override so the proxy
          # listens where the ccproxy provider in opencode.json points.
          PORT: "3000"
        run: |
          set -euo pipefail
          git clone --quiet https://github.com/MAXeaglet/commandcode-proxy /tmp/cc-proxy
          git -C /tmp/cc-proxy checkout --quiet "$CC_PROXY_COMMIT"
          nohup node /tmp/cc-proxy/proxy.mjs > /tmp/cc-proxy.log 2>&1 &
          for _ in $(seq 1 30); do
            if curl -sf http://127.0.0.1:3000/health >/dev/null; then
              echo "commandcode-proxy is up"
              exit 0
            fi
            sleep 1
          done
          echo "commandcode-proxy failed to start"; cat /tmp/cc-proxy.log; exit 1

      - name: Run OpenCode
        if: steps.member.outputs.allowed == 'true'
        uses: anomalyco/opencode/github@latest
        env:
          CC_PROXY_KEY: ${{ secrets.CC_PROXY_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          model: ccproxy/deepseek/deepseek-v4.1-flash
          use_github_token: true
          share: false
