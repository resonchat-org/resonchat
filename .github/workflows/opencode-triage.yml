# Automatically triage newly opened issues with OpenCode.
#
# Same runner-local `commandcode-proxy` + `ccproxy` provider setup as
# ../../opencode.yml. Only issues opened by a current organization member are
# triaged; membership is checked against the org members endpoint with
# `MEMBERSHIP_TOKEN` because `author_association` reports CONTRIBUTOR for
# private org memberships (see the note in ../../opencode.yml).

name: Issue triage

on:
  issues:
    types: [opened]

jobs:
  triage:
    runs-on: ubuntu-latest
    # The OpenCode App installation token performs the repo writes; this
    # workflow only needs to mint the OIDC token for the exchange.
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Require an organization member
        id: member
        env:
          MEMBERSHIP_TOKEN: ${{ secrets.MEMBERSHIP_TOKEN }}
        run: |
          set -euo pipefail
          code=$(curl -s -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer $MEMBERSHIP_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/orgs/resonchat-org/members/${{ github.actor }}")
          if [ "$code" = "204" ]; then
            echo "allowed=true" >> "$GITHUB_OUTPUT"
          else
            echo "allowed=false (org members lookup returned HTTP $code)"
            echo "allowed=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v6
        if: steps.member.outputs.allowed == 'true'
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Start commandcode-proxy
        if: steps.member.outputs.allowed == 'true'
        env:
          # Pinned for reproducibility; bump deliberately.
          CC_PROXY_COMMIT: 972828aff37f07c9cb12959bc6a1f4d44aaa005a
          # The upstream config.json defaults to 3050; override so the proxy
          # listens where the ccproxy provider in opencode.json points.
          PORT: "3000"
        run: |
          set -euo pipefail
          git clone --quiet https://github.com/MAXeaglet/commandcode-proxy /tmp/cc-proxy
          git -C /tmp/cc-proxy checkout --quiet "$CC_PROXY_COMMIT"
          nohup node /tmp/cc-proxy/proxy.mjs > /tmp/cc-proxy.log 2>&1 &
          for _ in $(seq 1 30); do
            if curl -sf http://127.0.0.1:3000/health >/dev/null; then
              echo "commandcode-proxy is up"
              exit 0
            fi
            sleep 1
          done
          echo "commandcode-proxy failed to start"; cat /tmp/cc-proxy.log; exit 1

      - name: Run OpenCode
        if: steps.member.outputs.allowed == 'true'
        uses: anomalyco/opencode/github@latest
        env:
          CC_PROXY_KEY: ${{ secrets.CC_PROXY_KEY }}
        with:
          model: ccproxy/deepseek/deepseek-v4.1-flash
          share: false
          prompt: |
            Review this issue. If there's a clear fix or relevant docs:
            - Provide documentation links
            - Add error handling guidance for code examples
            Otherwise, do not comment.
